services:
  apisix:
    image: apache/apisix:3.15.0-debian
    container_name: echoRide-apigateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-host.docker.internal:8114}
      USER_UPSTREAM: ${USER_UPSTREAM:-host.docker.internal:8115}
      RIDE_UPSTREAM: ${RIDE_UPSTREAM:-host.docker.internal:8111}
      LOCATION_UPSTREAM: ${LOCATION_UPSTREAM:-host.docker.internal:8112}
    volumes:
      - ../gateway-service/apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro,z
      - ../gateway-service/apisix_conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro,z
    ports:
      - "9080:9080"
      - "9180:9180"
      - "127.0.0.1:9091:9091" # Prometheus metrics
    extra_hosts:
      - "host.docker.internal:host-gateway" # Local dev only
    networks:
      - echoride_network
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/9080 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17
    container_name: echoRide-postgres
    command: ["postgres","-c", "wal_level=logical"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: echoride_db
    ports:
      - "5441:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - echoride_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d echoride_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    container_name: echoRide-keycloak
    image: quay.io/keycloak/keycloak:latest
    restart: always
    ports:
      - "8443:8443"
      - "8090:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_DB_URL: jdbc:postgresql://postgres:5432/echoride_db
      KC_DB: postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-123456789}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - echoride_network
    command:
      - start-dev

  redis:
    image: redis:8.0
    container_name: echoRide-redis
#    env_file:
#      - .env
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - echoride_network
    volumes:
      - redis_data:/data

