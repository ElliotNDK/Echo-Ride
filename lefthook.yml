pre-commit:
  parallel: false
  commands:
    tidy:
      glob:
        - "go.mod"
        - "go.sum"
        - "**/go.mod"
        - "**/go.sum"
      run: bash scripts/tidy-staged-go-modules.sh

    format:
      glob:
        - "*.go"
        - "**/*.go"
      run: goimports -w {staged_files}
      stage_fixed: true

    lint:
      glob:
        - "*.go"
        - "**/*.go"
      run: bash scripts/lint-staged-go-modules.sh

commit-msg:
  commands:
    validate-message:
      run: |
        head -n1 "{1}" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|chore|revert)(\(GER-[0-9]+\))?: .+$'
      errorMessage: |
        Wrong commit message format.
        Please use the Conventional Commits format:
        <type>(<scope>): <subject>
